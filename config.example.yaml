panel:
  base_url: "http://127.0.0.1:2053/"
  auth_mode: "auto"
  token_env: "THREEX_ABUSE_GUARD_TOKEN"
  username_env: "THREEX_ABUSE_GUARD_USERNAME"
  password_env: "THREEX_ABUSE_GUARD_PASSWORD"
  two_factor_code_env: "THREEX_ABUSE_GUARD_2FA_CODE"
  timeout_seconds: 10
  restart_xray: false

xray:
  access_log: "/var/log/x-ui/access.log"
  torrent_tag: "TORRENT"
  blocked_tag: "blocked"

detectors:
  torrent:
    enabled: true
    score: 100
    block_ip_on_hit: true
  blocked:
    enabled: true
    score: 10
  port_scan:
    enabled: true
    window_minutes: 5
    distinct_ports: 8
    score: 80
    cooldown_minutes: 5
  connection_rate:
    enabled: true
    window_minutes: 5
    max_connections: 300
    score: 60
    cooldown_minutes: 5

firewall:
  backend: "iptables"
  chain: "THREEX_ABUSE_GUARD"
  block_minutes: 1440
  bypass_ips:
    - "127.0.0.1"
    - "::1"

policy:
  mode: "balanced"
  window_minutes: 60
  torrent_ip_block_on_first_hit: true
  torrent_disable_client_after: 2
  blocked_disable_client_after: 0
  blocked_notify_after: 5
  profiles:
    default:
      notify_score: 50
      block_ip_score: 80
      disable_client_score: 200
    strict:
      notify_score: 30
      block_ip_score: 60
      disable_client_score: 100
    observe:
      notify_score: 50
      block_ip_score: 0
      disable_client_score: 0
  assignments:
    emails: {}
    inbounds: {}
    traffic: {}

notify:
  webhook_url: ""

state:
  path: "/var/lib/3x-abuse-guard/state.db"

logging:
  dir: "/var/log/3x-abuse-guard"
